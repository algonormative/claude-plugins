name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace
        run: claude plugin validate --strict .
      - name: Every listed plugin installs from its source
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          for name in $(jq -r '.plugins[].name' .claude-plugin/marketplace.json); do
            claude plugin install "$name@algonormative" --scope user
          done
          claude plugin list
